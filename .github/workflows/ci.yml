name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch: # permite rodar manualmente pelo GitHub

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend — Lint & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Run migrations (test DB)
        env:
          DATABASE_URL: postgresql://app:app_test@localhost:5432/app_test
          JWT_SECRET: test_secret_ci
        run: npm run migrate

      - name: Run tests
        env:
          DATABASE_URL: postgresql://app:app_test@localhost:5432/app_test
          JWT_SECRET: test_secret_ci
          NODE_ENV: test
        run: npm test -- --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage/

  frontend-build:
    name: Frontend — Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      - name: Audit backend
        working-directory: backend
        run: npm run audit
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Audit frontend
        working-directory: frontend
        run: npm run audit

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run security scanner
        run: node scripts/security-scan.js --all

      - name: Check for secrets with pattern matching
        run: |
          # Checar padrões de segredos em todos os arquivos JS/JSX.
          # Precisa falhar de verdade quando encontra algo — não só avisar.
          if grep -rE "(password|secret|api.?key)\s*[:=]\s*['\"][^'\"]{8,}" \
              --include="*.js" --include="*.jsx" \
              --exclude-dir=node_modules \
              --exclude-dir=dist \
              .; then
            echo "⚠ Possível segredo encontrado — revise"
            exit 1
          fi
          echo "Nenhum segredo hardcoded detectado"
