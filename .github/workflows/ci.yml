name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch: # permite rodar manualmente pelo GitHub

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend (Python) — Lint, Tipos & Testes
    runs-on: ubuntu-latest

    env:
      # Senha descartável do Postgres efêmero do CI (o banco só existe durante o job).
      CI_DB_PASSWORD: app_test

    services:
      postgres:
        # pgvector é obrigatório (índice HNSW de embeddings): a imagem alpine "pura" não o inclui.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: app_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests migrations

      - name: Format check (ruff)
        run: ruff format --check src tests migrations

      - name: Type check (mypy --strict)
        run: mypy src

      - name: Tests + coverage (mínimo de 80%)
        env:
          TEST_DATABASE_URL: postgresql://app:${{ env.CI_DB_PASSWORD }}@localhost:5432/app_test
        run: pytest --cov --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml

  frontend-build:
    name: Frontend — Lint, Testes & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  security-audit:
    name: Security Audit (dependências)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit backend (pip-audit)
        working-directory: backend
        run: |
          pip install -e ".[dev]"
          pip-audit --skip-editable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit frontend (audit-ci)
        working-directory: frontend
        run: |
          npm ci
          npm run audit

  security-scan:
    name: Security Scan (segredos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run security scanner
        run: node scripts/security-scan.js --all

      - name: Check for secrets with pattern matching
        run: |
          # Falha de verdade quando encontra algo — não só avisa.
          if grep -rE "(password|secret|api.?key)\s*[:=]\s*['\"][^'\"]{8,}" \
              --include="*.js" --include="*.jsx" --include="*.py" \
              --exclude-dir=node_modules \
              --exclude-dir=dist \
              --exclude-dir=.venv \
              --exclude-dir=tests \
              .; then
            echo "⚠ Possível segredo encontrado — revise"
            exit 1
          fi
          echo "Nenhum segredo hardcoded detectado"
