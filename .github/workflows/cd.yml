name: CD — Build & Push

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # nunca cancelar um deploy em andamento

jobs:
  build-and-push:
    name: Build Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta — backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Docker meta — frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # IMPORTANTE (lição de um incidente real): "environment: production" aqui
  # só bloqueia de verdade se o Environment "production" tiver "Required
  # reviewers" configurado em Settings > Environments no GitHub — isso não
  # é automático, é um clique manual por repositório, e planos free/privados
  # de organização podem não oferecer essa opção. Sem isso, este job roda
  # sozinho no primeiro push pra main, sem ninguém no caminho. Confirme essa
  # configuração antes de considerar este gate como proteção real.
  deploy:
    name: Deploy em produção
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy via SSH (ajuste pro seu alvo real)
        run: |
          echo "Configure aqui o deploy real (SSH restrito, Kubernetes, etc)."
          echo "Nunca dê ao workflow um shell completo na infra de produção —"
          echo "restrinja a chave/token a um único script/comando, como em"
          echo "authorized_keys com 'command=' fixo."

  deploy-staging:
    name: Deploy em staging
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Deploy via SSH (ajuste pro seu alvo real)
        run: echo "Configure aqui o deploy de staging."
