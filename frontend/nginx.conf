server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Default do nginx é 1m — barra silenciosamente qualquer upload maior
    # (ex.: anexos de PDF) antes de chegar no backend, com um 413 críptico.
    # Alinhe este valor com o limite configurado no Multer do backend (ver
    # backend/src/shared/constants/upload.js) — os dois precisam bater.
    client_max_body_size 4M;

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # Uploads proxy
    location /uploads/ {
        proxy_pass http://backend:3001/uploads/;
    }

    # React Router — fallback para index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
