services:
  db:
    # pgvector: busca vetorial do RAG roda no próprio PostgreSQL (ADR-002).
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-app}
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Aplica as migrations e sobe a API. O worker só inicia depois que a API está saudável.
    command: sh -c "alembic upgrade head && uvicorn cbot.main:create_app --factory --host 0.0.0.0 --port 3001"
    env_file: ../../.env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-app}:${DB_PASSWORD:-app_secret}@db:5432/${DB_NAME:-app}
      STORAGE_DIR: /data/arquivos
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - arquivos:/data/arquivos
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:3001/health', timeout=4)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # Mesmo código da API, outro processo: agenda sincronizações com o Canvas, indexa e envia resumos.
  worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: python -m cbot.worker
    env_file: ../../.env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-app}:${DB_PASSWORD:-app_secret}@db:5432/${DB_NAME:-app}
      STORAGE_DIR: /data/arquivos
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - arquivos:/data/arquivos

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  arquivos:
