services:
  db:
    ports:
      - "${DB_HOST_PORT:-5432}:5432"

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile.dev
    command: sh -c "alembic upgrade head && uvicorn cbot.main:create_app --factory --host 0.0.0.0 --port 3001 --reload --reload-dir src"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://${DB_USER:-app}:${DB_PASSWORD:-app_secret}@db:5432/${DB_NAME:-app}
      # Sem isso cai no default do compose base (sem porta) — não bate com a origem do Vite
      # (localhost:5173) e o navegador bloqueia por CORS.
      CORS_ORIGIN: http://localhost:5173
    volumes:
      - ../../backend/src:/app/src
      - arquivos:/data/arquivos

  worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile.dev
    command: python -m cbot.worker
    environment:
      APP_ENV: development
    volumes:
      - ../../backend/src:/app/src
      - arquivos:/data/arquivos

  frontend:
    build: !reset null
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ../../frontend:/app
    ports:
      - "5173:5173"
    environment:
      VITE_PROXY_TARGET: http://backend:3001
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend
