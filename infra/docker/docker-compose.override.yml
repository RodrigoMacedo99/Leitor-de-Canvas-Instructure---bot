services:
  db:
    ports:
      - "${DB_HOST_PORT:-5432}:5432"

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${DB_USER:-app}:${DB_PASSWORD:-app_secret}@db:5432/${DB_NAME:-app}
      # Sem isso cai no default "http://localhost" (sem porta) do docker-compose
      # base — não bate com a origem real do Vite (localhost:5173), então o
      # navegador bloqueia por CORS qualquer checagem de sessão após reload.
      CORS_ORIGIN: http://localhost:5173
    volumes:
      - ../../backend/src:/app/src
      - uploads:/app/uploads
    command: npm run dev

  frontend:
    build: !reset null
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ../../frontend:/app
    ports:
      - "5173:5173"
    environment:
      VITE_PROXY_TARGET: http://backend:3001
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend
